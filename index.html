<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#10161D" />
    <meta name="description" content="Cartera de préstamos — Agencia Gold" />

    <!-- iOS: permite instalar como app de pantalla completa -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cartera Gold" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Cartera Gold</title>
    <style>
      html, body, #root {
        height: 100%;
        overscroll-behavior-y: none;
      }
      html, body {
        /* "position: fixed" (no solo overflow:hidden) es lo que de verdad le
           quita a iOS la posibilidad de "recorrer" (panear) la página entera
           al enfocar un campo. Con solo overflow:hidden, iOS a veces sigue
           desplazando toda la ventana visual para subir el campo enfocado
           por encima del teclado, revelando un hueco vacío debajo de
           nuestro contenido — un bug conocido de Safari/WebKit. Al fijar la
           página por completo, forzamos a que el ÚNICO elemento que pueda
           desplazarse sea nuestro propio contenedor de contenido interno,
           que si sabe hasta dónde llega su contenido real. */
        position: fixed;
        inset: 0;
        width: 100%;
      }
      body {
        margin: 0;
        background: #10161D;
        overflow: hidden;
      }
      .cartera-shell {
        /* Cadena de fallback: vh clásico -> dvh (excluye barras del navegador
           en los navegadores que lo soportan) -> --app-height, calculado en JS
           a partir de window.visualViewport, que es lo único que refleja de
           forma consistente el espacio real disponible en TODOS los
           navegadores (Safari, Chrome, WebViews de apps como WhatsApp/
           Instagram, etc.), incluso cuando su barra de direcciones u otros
           botones cambian de tamaño o aparecen/desaparecen.
           Al abrirla como app instalada en pantalla de inicio (standalone),
           visualViewport.height NO incluye la franja del indicador de inicio
           de iPhone (safe-area-inset-bottom), así que la sumamos aparte para
           que el fondo de la app llegue hasta el borde real de la pantalla
           en vez de dejar un hueco negro sin usar debajo del menú. Cuando el
           teclado está abierto, iOS reporta ese inset como 0, así que sumarlo
           siempre es seguro y no afecta ese caso. */
        height: 100vh;
        height: 100dvh;
        height: calc(var(--app-height, 100dvh) + env(safe-area-inset-bottom, 0px));
      }
    </style>
    <script>
      // Calcula el alto real visible (sin la barra de direcciones ni botones
      // propios del navegador/app que esté mostrando la página) y lo expone
      // como variable CSS. Se recalcula cada vez que ese espacio cambia, para
      // que la barra inferior de la app siempre quede pegada al límite real
      // de lo visible, sin dejar hueco ni quedar tapada.
      (function () {
        function setAppHeight() {
          var vv = window.visualViewport;
          var h = vv ? vv.height : window.innerHeight;
          document.documentElement.style.setProperty("--app-height", h + "px");
        }
        setAppHeight();
        window.addEventListener("resize", setAppHeight);
        window.addEventListener("orientationchange", setAppHeight);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", setAppHeight);
          window.visualViewport.addEventListener("scroll", setAppHeight);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
